<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quiver Layout v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    padding: 32px;
  }
  h2 { color: #fff; font-size: 18px; margin-bottom: 6px; text-align: center; }
  .subtitle { color: rgba(255,255,255,0.5); font-size: 13px; text-align: center; margin-bottom: 24px; }

  .desktop {
    background: radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 1px);
    background-size: 5px 5px;
    background-color: #111;
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 780px;
  }

  .app-window {
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    height: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .sidebar {
    width: 180px;
    min-width: 120px;
    max-width: 320px;
    background: rgba(50,50,55,0.92);
    backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .top-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 10px 8px;
    cursor: grab;
    flex-shrink: 0;
  }
  .traffic-lights { display: flex; gap: 5px; align-items: center; }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot-red    { background: #FE5F57; }
  .dot-yellow { background: #FEBC2E; }
  .dot-green  { background: #27C840; }
  .nav-icons { display: flex; gap: 6px; }
  .nav-icon { width: 14px; height: 14px; opacity: 0.4; display: flex; align-items: center; justify-content: center; font-size: 10px; color: white; }

  /* ── Search bar ── */
  .search-wrap {
    margin: 0 8px 6px;
    flex-shrink: 0;
  }
  .search-bar {
    border-radius: 5px;
    padding: 5px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    background: rgba(255,255,255,0.07);
    border: 1px solid transparent;
    transition: background 0.15s, border-color 0.15s;
    cursor: text;
    position: relative;
  }
  /* hover OR typing activates */
  .search-bar.active {
    background: rgba(255,255,255,0.95);
    border-color: rgba(255,255,255,0.2);
  }
  .search-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 11px;
    color: rgba(255,255,255,0.85);
    font-family: inherit;
    min-width: 0;
  }
  .search-bar.active .search-input {
    color: rgba(0,0,0,0.8);
  }
  .search-input::placeholder { color: rgba(255,255,255,0.38); }
  .search-bar.active .search-input::placeholder { color: rgba(0,0,0,0.35); }
  .search-icon-wrap {
    flex-shrink: 0;
    opacity: 0.45;
    display: flex;
    align-items: center;
  }
  .search-bar.active .search-icon-wrap { opacity: 0.5; }
  .search-icon-wrap svg { display: block; }

  /* ── Arrow list ── */
  .arrow-list {
    flex: 1;
    overflow-y: auto;
    padding: 2px 4px;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .arrow-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 6px;
    border-radius: 4px;
    cursor: pointer;
    min-height: 26px;
    transition: background 0.1s;
  }
  .arrow-item:hover:not(.selected) {
    background: rgba(255,255,255,0.08);
  }
  .arrow-item.selected {
    background: #ffffff;
  }
  .arrow-icon {
    width: 18px; height: 18px;
    border-radius: 3px;
    flex-shrink: 0;
    background: #F5A623;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
  }
  .arrow-label {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }
  .arrow-name {
    font-size: 11px;
    font-weight: 500;
    color: rgba(255,255,255,0.8);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .arrow-item.selected .arrow-name { color: rgba(0,0,0,0.8); }

  /* Subtitle: hidden by default, shown only on selected+hover */
  .arrow-sub {
    font-size: 9px;
    color: rgba(0,0,0,0.45);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.15s ease, opacity 0.15s ease;
  }
  .arrow-item.selected:hover .arrow-sub {
    max-height: 20px;
    opacity: 1;
  }

  /* Resize handle */
  .resize-handle {
    width: 4px;
    background: transparent;
    cursor: col-resize;
    flex-shrink: 0;
    transition: background 0.15s;
    position: relative;
  }
  .resize-handle::after {
    content: '';
    position: absolute;
    inset: 0;
    width: 12px;
    left: -4px;
  }
  .resize-handle:hover, .resize-handle.dragging {
    background: rgba(255,255,255,0.15);
  }

  /* Main content */
  .main-content {
    flex: 1;
    background: #222222;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.08);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Labels */
  .label-row {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 14px;
  }
  .label-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .label-item .tag {
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.07);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .label-item .desc {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

<h2>Quiver — Scaffold Layout v2</h2>
<p class="subtitle">Hover search to activate · hover selected item to see namespace · drag handle to resize</p>

<div class="desktop">
  <div class="app-window" id="appWindow">

    <div class="sidebar" id="sidebar">
      <div class="top-nav">
        <div class="traffic-lights">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
        </div>
        <div class="nav-icons">
          <div class="nav-icon">⊞</div>
          <div class="nav-icon">≡</div>
        </div>
      </div>

      <div class="search-wrap">
        <div class="search-bar" id="searchBar">
          <input
            class="search-input"
            id="searchInput"
            type="text"
            placeholder="Search anything"
            autocomplete="off"
          />
          <div class="search-icon-wrap">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
              <circle cx="6.5" cy="6.5" r="4.5" stroke="white" stroke-width="1.5"/>
              <path d="M10 10L14 14" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="arrow-list" id="arrowList">
        <!-- items injected by JS so we can do click-to-select cleanly -->
      </div>
    </div>

    <div class="resize-handle" id="resizeHandle"></div>

    <div class="main-content">content area</div>
  </div>

  <div class="label-row">
    <div class="label-item">
      <span class="tag">Search</span>
      <span class="desc">Activates on hover or typing<br>Deactivates when neither</span>
    </div>
    <div class="label-item">
      <span class="tag">Namespace</span>
      <span class="desc">Only on selected item + hover<br>Hidden otherwise</span>
    </div>
    <div class="label-item">
      <span class="tag">Resize</span>
      <span class="desc">Drag handle · 120–320px</span>
    </div>
  </div>
</div>

<script>
// ── Arrow items ──
const items = [
  { name: 'Quiver', sub: null },
  { name: 'Quiver', sub: null },
  { name: 'Quiver', sub: 'github.com/char2cs/quiver.experiments' },
  { name: 'Quiver', sub: null },
  { name: 'Quiver', sub: null },
  { name: 'Quiver', sub: null },
  { name: 'Quiver', sub: null },
  { name: 'Quiver', sub: null },
  { name: 'Quiver', sub: null },
  { name: 'Quiver', sub: null },
];

const list = document.getElementById('arrowList');
items.forEach((item, i) => {
  const el = document.createElement('div');
  el.className = 'arrow-item' + (i === 2 ? ' selected' : '');
  el.innerHTML = `
    <div class="arrow-icon">🏹</div>
    <div class="arrow-label">
      <span class="arrow-name">${item.name}</span>
      ${item.sub ? `<span class="arrow-sub">${item.sub}</span>` : ''}
    </div>
  `;
  el.addEventListener('click', () => {
    document.querySelectorAll('.arrow-item').forEach(x => x.classList.remove('selected'));
    el.classList.add('selected');
  });
  list.appendChild(el);
});

// ── Search bar: activate on hover OR typing, deactivate when neither ──
const searchBar = document.getElementById('searchBar');
const searchInput = document.getElementById('searchInput');
let isHovering = false;
let isTyping = false;

function updateSearch() {
  if (isHovering || isTyping) {
    searchBar.classList.add('active');
    if (isHovering) searchInput.focus();
  } else {
    searchBar.classList.remove('active');
    searchInput.blur();
  }
}

searchBar.addEventListener('mouseenter', () => { isHovering = true; updateSearch(); });
searchBar.addEventListener('mouseleave', () => { isHovering = false; updateSearch(); });
searchInput.addEventListener('input', () => { isTyping = searchInput.value.length > 0; updateSearch(); });
searchInput.addEventListener('blur', () => { isTyping = false; updateSearch(); });

// ── Resize handle ──
const handle = document.getElementById('resizeHandle');
const sidebar = document.getElementById('sidebar');
let isResizing = false, startX = 0, startWidth = 0;

handle.addEventListener('mousedown', e => {
  isResizing = true;
  startX = e.clientX;
  startWidth = sidebar.offsetWidth;
  handle.classList.add('dragging');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', e => {
  if (!isResizing) return;
  const w = Math.min(320, Math.max(120, startWidth + (e.clientX - startX)));
  sidebar.style.width = w + 'px';
});
document.addEventListener('mouseup', () => {
  if (!isResizing) return;
  isResizing = false;
  handle.classList.remove('dragging');
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});
</script>
</body>
</html>
