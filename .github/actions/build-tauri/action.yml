name: 'Build Tauri App'
description: 'Fetch the quiver.core sidecar and build the Tauri app for the current platform'

inputs:
  quiver-version:
    description: >-
      Resolved quiver.core release TAG to fetch the sidecar from (e.g.
      stable-26.5.1) — never package.json's `quiver.coreVersion` constraint.
      Callers resolve that through scripts/resolve-core-version.mjs first; see
      the `prepare` job in nightly/prerelease/stable-release.yml.
    required: true
  release-tag:
    description: >-
      The quiver.desktop release tag THIS build is being cut from
      (`stable-<series>[.patch]`), baked into the binary by src-tauri/build.rs
      so the app can announce its own arrow at a ref that really resolves.
      Optional, and empty is the ordinary case: only stable-release.yml pushes
      its tag before building, so only it can name one. Nightly and
      pre-release builds leave it unset and the app falls back to announcing
      refless, exactly as before.
    required: false
    default: ''
  rust-version:
    description: 'Rust toolchain version'
    required: false
    default: '1.88'
  bun-version:
    description: 'Bun version'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    # A guard, not ceremony. package.json pins a semver CONSTRAINT ("^26.5"),
    # and resolving it to a real tag is the caller's job. When that was missed,
    # every `gh release download` below ran with a literal "^26.5" and every
    # platform of every release build failed at sidecar fetch — three jobs deep,
    # with an error naming the symptom rather than the cause. Fail here, where
    # the cause is, and before an hour of toolchain setup.
    - name: Validate the resolved quiver.core tag
      shell: bash
      env:
        QUIVER_VERSION: ${{ inputs.quiver-version }}
      run: |
        if [ -z "$QUIVER_VERSION" ]; then
          echo "❌ quiver-version is empty — the caller's resolve step produced no tag."
          exit 1
        fi
        case "$QUIVER_VERSION" in
          stable-*|beta-*|hotfix-*) ;;
          *)
            echo "❌ quiver-version must be a resolved quiver.core tag (stable-*/beta-*/hotfix-*), got '${QUIVER_VERSION}'."
            echo "   Resolve package.json's quiver.coreVersion constraint with scripts/resolve-core-version.mjs before calling this action."
            exit 1
            ;;
        esac
        echo "✅ fetching the quiver.core sidecar from ${QUIVER_VERSION}"

    # Same reasoning as the guard above, one layer quieter: a malformed tag
    # here does not break the build, it is simply rejected at runtime by
    # `commands::build_info::is_release_tag` and the app announces refless —
    # so a mistyped caller would ship a release that silently behaves like a
    # dev build. Say so here instead, where the cause is.
    - name: Validate the release tag, when one was given
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        if [ -z "$RELEASE_TAG" ]; then
          echo "ℹ️  no release-tag given — this build will announce its own arrow refless."
          exit 0
        fi
        if ! echo "$RELEASE_TAG" | grep -Eq '^stable-[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
          echo "❌ release-tag must be a quiver.desktop stable tag (stable-<series>[.patch]), got '${RELEASE_TAG}'."
          echo "   Anything else is rejected at runtime and the build would ship announcing refless."
          exit 1
        fi
        echo "✅ stamping this build as ${RELEASE_TAG}"

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev \
          build-essential curl wget file \
          libssl-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ inputs.rust-version }}
        # macOS ships a universal binary, which cargo can only produce by
        # building each arch and lipo-ing them — so both targets must exist.
        target: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          src-tauri/target/
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-release-

    # macOS gets BOTH architectures lipo'd into one sidecar. Fetching only
    # arm64 (as this action used to) produces a DMG that installs happily on an
    # Intel Mac and then fails to start its daemon — the app looks fine right
    # up until it needs the backend.
    - name: Fetch quiver.core sidecar (macOS, universal)
      if: runner.os == 'macOS'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p src-tauri/binaries
        gh release download "${{ inputs.quiver-version }}" \
          --repo rabbytesoftware/quiver.core \
          --pattern 'quiver-darwin-arm64' --pattern 'quiver-darwin-amd64' \
          --dir src-tauri/binaries --clobber

        mv src-tauri/binaries/quiver-darwin-arm64 src-tauri/binaries/quiver-aarch64-apple-darwin
        mv src-tauri/binaries/quiver-darwin-amd64 src-tauri/binaries/quiver-x86_64-apple-darwin

        # `cargo tauri build --target universal-apple-darwin` looks for a single
        # sidecar named for the universal triple. It does NOT lipo the two
        # arch-specific ones on its own.
        lipo -create \
          src-tauri/binaries/quiver-aarch64-apple-darwin \
          src-tauri/binaries/quiver-x86_64-apple-darwin \
          -output src-tauri/binaries/quiver-universal-apple-darwin

        chmod +x src-tauri/binaries/quiver-*
        lipo -info src-tauri/binaries/quiver-universal-apple-darwin

    - name: Fetch quiver.core sidecar (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p src-tauri/binaries
        gh release download "${{ inputs.quiver-version }}" \
          --repo rabbytesoftware/quiver.core \
          --pattern 'quiver-linux-amd64' \
          --dir src-tauri/binaries --clobber
        mv src-tauri/binaries/quiver-linux-amd64 \
           src-tauri/binaries/quiver-x86_64-unknown-linux-gnu
        chmod +x src-tauri/binaries/quiver-x86_64-unknown-linux-gnu

    - name: Fetch quiver.core sidecar (Windows)
      if: runner.os == 'Windows'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p src-tauri/binaries
        gh release download "${{ inputs.quiver-version }}" \
          --repo rabbytesoftware/quiver.core \
          --pattern 'quiver-windows-amd64.exe' \
          --dir src-tauri/binaries --clobber
        mv src-tauri/binaries/quiver-windows-amd64.exe \
           src-tauri/binaries/quiver-x86_64-pc-windows-msvc.exe

    - name: Install frontend dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - uses: cargo-bins/cargo-binstall@main

    - name: Install tauri-cli
      shell: bash
      run: cargo binstall tauri-cli@^2 --no-confirm --locked

    # macOS only, and a self-skipping no-op unless Xcode 26+ is selected. The
    # job must run on `macos-26`: macOS 15's newest Xcode is 26.3, whose actool
    # CRASHES on our .icon (CompileAssetCatalogVariant exit 65).
    - name: Compile the Tahoe adaptive icon
      if: runner.os == 'macOS'
      shell: bash
      run: bash icons-compiler/compile-icon.sh

    # QUIVER_DESKTOP_RELEASE_TAG on each of the three build steps (and only on
    # those): it is read by src-tauri/build.rs at compile time, and cargo
    # re-runs that script when the variable changes, so a restored target/
    # cache cannot carry the previous release's stamp into this one.
    - name: Build Tauri app (macOS universal DMG)
      if: runner.os == 'macOS'
      shell: bash
      env:
        QUIVER_DESKTOP_RELEASE_TAG: ${{ inputs.release-tag }}
      run: bash scripts/build-macos-dmg.sh

    # bundle.macOS.files points at icons/Assets.car, which only ever exists
    # after the macOS icon step. Clear the mapping so the bundler doesn't trip
    # over a file that was never going to be there on this platform.
    - name: Build Tauri app (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        QUIVER_DESKTOP_RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        cargo tauri build --bundles appimage,deb \
          --config '{"bundle":{"macOS":{"files":{}}}}'

    - name: Build Tauri app (Windows)
      if: runner.os == 'Windows'
      shell: bash
      env:
        QUIVER_DESKTOP_RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        cargo tauri build --bundles msi,nsis \
          --config '{"bundle":{"macOS":{"files":{}}}}'
