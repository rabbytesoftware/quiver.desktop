name: 'Build Native App'
description: >-
  Fetch the quiver.core sidecar, build the GPUI app WITHOUT the e2e bridge and assemble this OS's bundle in
  target/bundle/ (cargo xtask package).

inputs:
  quiver-version:
    description: >-
      Resolved quiver.core release TAG to fetch the sidecar from (stable-26.5.1, nightly-latest), never a
      channel name. Callers resolve it with `cargo xtask resolve-core-version <channel>` first.
    required: true
  release-tag:
    description: >-
      The quiver.desktop stable tag this build is cut from (`stable-<series>[.patch]`), baked in through
      QUIVER_DESKTOP_RELEASE_TAG (crates/quiver-release/build.rs). Empty for nightly and pre-release builds.
    required: false
    default: ''
  build-label:
    description: >-
      The release tag this build is published as in any channel (stable-/beta-/hotfix-), baked in through
      QUIVER_DESKTOP_STAMP_LABEL. Display only. Falls back to release-tag.
    required: false
    default: ''
  release-channel:
    description: 'stable, beta, hotfix or nightly-rolling; baked in through QUIVER_DESKTOP_BUILD_CHANNEL.'
    required: false
    default: ''
  bundle-version:
    description: >-
      Numeric major.minor.patch in the bundle file names and installer metadata (the NSIS installer needs it
      numeric). It does not track the git tag; the updater selects assets by suffix.
    required: false
    default: '0.1.0'
  rust-version:
    description: 'Rust toolchain version'
    required: false
    default: 'stable'

runs:
  using: 'composite'
  steps:
    - name: Validate the resolved quiver.core tag
      shell: bash
      env:
        QUIVER_VERSION: ${{ inputs.quiver-version }}
      run: |
        case "$QUIVER_VERSION" in
          stable-*|beta-*|hotfix-*|nightly-latest) echo "fetching the quiver.core sidecar from ${QUIVER_VERSION}" ;;
          *) echo "quiver-version must be a resolved quiver.core tag (stable-*/beta-*/hotfix-*/nightly-latest), got '${QUIVER_VERSION}'"; exit 1 ;;
        esac

    - name: Validate the release tag, label and channel
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
        BUILD_LABEL: ${{ inputs.build-label || inputs.release-tag }}
        RELEASE_CHANNEL: ${{ inputs.release-channel }}
      run: |
        # Anything else is dropped at runtime (quiver-release build stamp) and the app would silently behave
        # like an unstamped dev build, so fail here where the cause is.
        if [ -n "$RELEASE_TAG" ] && ! echo "$RELEASE_TAG" | grep -Eq '^stable-[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
          echo "release-tag must be stable-<series>[.patch], got '${RELEASE_TAG}'"; exit 1
        fi
        if [ -n "$BUILD_LABEL" ] && ! echo "$BUILD_LABEL" | grep -Eq '^(stable-[0-9]+\.[0-9]+(\.[0-9]+)?|(beta|hotfix)-([0-9]+(\.[0-9]+)+|[0-9]{4}-[0-9]{2}-[0-9]{2})(-[0-9]+)?)$'; then
          echo "build-label must be a stable, beta or hotfix tag, got '${BUILD_LABEL}'"; exit 1
        fi
        case "$RELEASE_CHANNEL" in
          ''|stable|beta|hotfix|nightly-rolling) ;;
          *) echo "release-channel must be stable, beta, hotfix or nightly-rolling, got '${RELEASE_CHANNEL}'"; exit 1 ;;
        esac

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake clang pkg-config file patchelf dpkg-dev \
          libfontconfig-dev libfreetype-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
          libssl-dev libvulkan-dev libx11-dev libx11-xcb-dev libxcb-xkb-dev libxkbfile-dev libdbus-1-dev \
          libzstd-dev libasound2-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libsecret-1-dev \
          libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
        # appimagetool is itself an AppImage; xtask runs it with APPIMAGE_EXTRACT_AND_RUN, so no FUSE is
        # needed. NOT VERIFIED from here: the pinned release asset name and that this version still exists.
        curl -fsSL -o /usr/local/bin/appimagetool \
          https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage \
          || { echo "could not download appimagetool 1.9.0"; exit 1; }
        sudo chmod +x /usr/local/bin/appimagetool || chmod +x /usr/local/bin/appimagetool

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ inputs.rust-version }}
        # A universal macOS binary is two cargo builds merged with lipo.
        target: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

    - name: Fetch the quiver.core sidecar(s)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        QUIVER_VERSION: ${{ inputs.quiver-version }}
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          # BOTH architectures: a DMG with only arm64 installs on an Intel Mac and then cannot start its daemon.
          cargo xtask fetch-sidecar --tag "$QUIVER_VERSION" --target aarch64-apple-darwin
          cargo xtask fetch-sidecar --tag "$QUIVER_VERSION" --target x86_64-apple-darwin
        else
          cargo xtask fetch-sidecar --tag "$QUIVER_VERSION"
        fi

    # The NSIS installer embeds this (installer/windows/windows-installer-hooks.nsh). aka.ms always serves the
    # latest 14.x, so there is no stable hash to pin; the Authenticode signature proves the file is genuine.
    - name: Fetch the VC++ redistributable (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $path = Join-Path $env:RUNNER_TEMP 'vc_redist.x64.exe'
        Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile $path
        $sig = Get-AuthenticodeSignature $path
        if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
          throw "vc_redist.x64.exe is not validly signed by Microsoft (status: $($sig.Status))"
        }
        "QUIVER_VCREDIST_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        # makensis ships on windows-latest runner images; install it if a future image drops it.
        if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }

    # Signing is opt-in. An unset secret expands to an empty string; empty values are treated as absent by
    # xtask, so an unconfigured run produces the ad-hoc signed DMG. UNVERIFIED here: needs the Apple secrets.
    - name: Import the Developer ID certificate (macOS, when configured)
      if: runner.os == 'macOS'
      shell: bash
      env:
        APPLE_CERTIFICATE: ${{ env.APPLE_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
      run: |
        if [ -z "${APPLE_CERTIFICATE:-}" ]; then
          echo "no APPLE_CERTIFICATE: the bundle will be ad-hoc signed"
          exit 0
        fi
        KEYCHAIN="$RUNNER_TEMP/quiver-build.keychain-db"
        KEYCHAIN_PASSWORD="$(uuidgen)"
        echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/security
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        rm -f "$RUNNER_TEMP/certificate.p12"

    # The stamps are compile-time inputs: cargo re-runs quiver-release's build.rs when they change, so a
    # restored target/ cache cannot carry the previous release's stamp. NEVER pass --features e2e-bridge here.
    - name: Build and package
      shell: bash
      env:
        QUIVER_DESKTOP_RELEASE_TAG: ${{ inputs.release-tag }}
        QUIVER_DESKTOP_STAMP_LABEL: ${{ inputs.build-label || inputs.release-tag }}
        QUIVER_DESKTOP_BUILD_CHANNEL: ${{ inputs.release-channel }}
        BUNDLE_VERSION: ${{ inputs.bundle-version }}
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          cargo build --release -p quiver-app --target aarch64-apple-darwin
          cargo build --release -p quiver-app --target x86_64-apple-darwin
          cargo xtask package macos --universal --version "$BUNDLE_VERSION"
        else
          cargo build --release -p quiver-app
          cargo xtask package --version "$BUNDLE_VERSION"
        fi

    - name: Check the binaries carry no e2e bridge
      shell: bash
      run: |
        # cargo writes target/release/ or target/<triple>/release/; only the shipped binaries, not build scripts.
        files=$(find target -maxdepth 3 -path '*release/*' -type f \
          \( -name quiver -o -name quiverdesktop -o -name 'quiver*.exe' \))
        test -n "$files" || { echo "no release binaries found"; exit 1; }
        cargo xtask check-release-artifact $files
