name: E2E (pre-release)

# A PRE-RELEASE GATE, not a per-PR check (ci.yml's native-e2e-box runs the same box on PRs; this one also runs
# on stable tags). The scenarios build the app WITH the e2e bridge feature, boot a real quiver.core daemon built
# from source and drive the GPUI window through the bridge, in the Linux desktop container (docker/e2e).
# The old tauri-driver/WebdriverIO job is gone with the Tauri app.
on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'quiver.core ref the E2E box builds its daemon from'
        default: develop
  push:
    tags:
      - 'stable-*'

jobs:
  e2e-box:
    name: Update E2E (Linux desktop container)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout quiver.desktop
        uses: actions/checkout@v4
        with:
          path: quiver.desktop

      - name: Checkout quiver.core
        uses: actions/checkout@v4
        with:
          repository: rabbytesoftware/quiver.core
          ref: ${{ inputs.core_ref || 'develop' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: quiver.core

      - name: Run the scenarios in the box
        env:
          QUIVER_CORE_DEV_PATH: ${{ github.workspace }}/quiver.core
        run: make -C quiver.desktop test-e2e-box

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-box-results
          path: quiver.desktop/docker/e2e/results/
          if-no-files-found: ignore
