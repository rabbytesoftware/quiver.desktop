name: CI

on:
  pull_request:
    branches: [ master, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]

env:
  RUST_VERSION: '1.85'
  BUN_VERSION: 'latest'

jobs:
  draft-reminder:
    name: Draft PR Reminder
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == true && github.event.action == 'opened'
    permissions:
      pull-requests: write
    steps:
    - name: Comment on draft PR
      uses: actions/github-script@v9
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `⚠️ **Draft PR Reminder**\n\nHey @${context.payload.pull_request.user.login}!\n\nBe sure to run the command \`make pr-checks\` before opening this PR. Thanks!\n\n> **Note:** CI won't run on draft PRs to optimize [GitHub Actions billing](https://docs.github.com/en/billing/concepts/product-billing/github-actions). Mark as ready for review when you're done! 🚀`
          });

  validate-branch:
    name: Validate Branch Model
    runs-on: ubuntu-latest
    steps:
    - name: Check if PR is draft
      run: |
        if [ "${{ github.event.pull_request.draft }}" == "true" ]; then
          echo "❌ This PR is a draft. Please mark it as ready for review to run CI checks."
          exit 1
        fi
        echo "✅ PR is ready for review"

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate branching model
      run: |
        SOURCE_BRANCH="${{ github.head_ref }}"
        TARGET_BRANCH="${{ github.base_ref }}"

        echo "Source branch: $SOURCE_BRANCH"
        echo "Target branch: $TARGET_BRANCH"

        validate_branch() {
          case "$SOURCE_BRANCH" in
            enhancement/*)
              if [ "$TARGET_BRANCH" != "develop" ]; then
                echo "❌ Enhancement branches can only target 'develop', not '$TARGET_BRANCH'"
                exit 1
              fi
              ;;
            feature/*)
              if [ "$TARGET_BRANCH" != "develop" ]; then
                echo "❌ Feature branches can only target 'develop', not '$TARGET_BRANCH'"
                exit 1
              fi
              ;;
            fix/*)
              if [ "$TARGET_BRANCH" != "develop" ]; then
                echo "❌ Fix branches can only target 'develop', not '$TARGET_BRANCH'"
                exit 1
              fi
              ;;
            refactor/*)
              if [ "$TARGET_BRANCH" != "develop" ]; then
                echo "❌ Refactor branches can only target 'develop', not '$TARGET_BRANCH'"
                exit 1
              fi
              ;;
            dependabot/*)
              if [ "$TARGET_BRANCH" != "develop" ]; then
                echo "❌ Dependabot branches can only target 'develop', not '$TARGET_BRANCH'"
                exit 1
              fi
              ;;
            hotfix/*)
              if [ "$TARGET_BRANCH" != "master" ]; then
                echo "❌ Hotfix branches can only target 'master', not '$TARGET_BRANCH'"
                exit 1
              fi
              ;;
            beta/*)
              if [ "$TARGET_BRANCH" != "master" ]; then
                echo "❌ Beta branches can only target 'master', not '$TARGET_BRANCH'"
                exit 1
              fi
              ;;
            backport/*)
              if [ "$TARGET_BRANCH" != "develop" ]; then
                echo "❌ Backport branches can only target 'develop', not '$TARGET_BRANCH'"
                exit 1
              fi
              ;;
            *)
              echo "❌ Invalid branch name '$SOURCE_BRANCH'. Must follow pattern:"
              echo "  - enhancement/name (→ develop)"
              echo "  - feature/name (→ develop)"
              echo "  - fix/name (→ develop)"
              echo "  - refactor/name (→ develop)"
              echo "  - hotfix/name (→ master)"
              echo "  - beta/YY.M or beta/YY.M.P (→ master)"
              echo "  - backport/DATE-VERSION (→ develop)"
              exit 1
              ;;
          esac

          echo "✅ Quiver loves your PR: $SOURCE_BRANCH → $TARGET_BRANCH"
        }

        validate_branch

  validate-core-version:
    name: Validate CORE_VERSION
    runs-on: ubuntu-latest
    needs: validate-branch
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate CORE_VERSION exists on quiver.core
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        CORE_VERSION=$(cat CORE_VERSION)
        echo "Validating quiver.core release: ${CORE_VERSION}"
        gh release view "$CORE_VERSION" --repo rabbytesoftware/quiver.core || {
          echo "❌ quiver.core release ${CORE_VERSION} not found. Update CORE_VERSION to a published release before merging."
          exit 1
        }
        echo "✅ quiver.core release ${CORE_VERSION} exists"

  code-quality-frontend:
    name: Code Quality - Frontend
    runs-on: ubuntu-latest
    needs: validate-branch

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ env.BUN_VERSION }}

    - name: Cache Bun dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.bun/install/cache
          node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install

    - name: Format check
      run: |
        bunx prettier --check "src/**/*.{ts,tsx,js,jsx}"
        echo "✅ Code formatting is correct"

    - name: Lint check
      run: |
        bunx eslint "src/**/*.{ts,tsx,js,jsx}"
        echo "✅ Linting passed"

    - name: Type checking
      run: |
        bunx tsc --noEmit
        echo "✅ Type checking passed"

  code-quality-rust:
    name: Code Quality - Rust
    runs-on: ubuntu-latest
    needs: validate-branch

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: rustfmt, clippy

    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          src-tauri/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Create sidecar placeholder
      run: |
        mkdir -p src-tauri/binaries
        TARGET_TRIPLE=$(rustc -vV | grep host | awk '{print $2}')
        touch "src-tauri/binaries/quiver-${TARGET_TRIPLE}"
        chmod +x "src-tauri/binaries/quiver-${TARGET_TRIPLE}"

    - name: Format check
      run: |
        cd src-tauri
        cargo fmt --check
        echo "✅ Rust formatting is correct"

    - name: Clippy check
      run: |
        cd src-tauri
        cargo clippy -- -D warnings
        echo "✅ Clippy checks passed"

    - name: Security audit
      continue-on-error: true
      run: |
        cargo install cargo-audit --locked --force
        cd src-tauri
        cargo audit
        echo "✅ Security audit passed"

  build-frontend:
    name: Build - Frontend
    runs-on: ubuntu-latest
    needs: [code-quality-frontend]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ env.BUN_VERSION }}

    - name: Cache Bun dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.bun/install/cache
          node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install

    - name: Build frontend
      run: bun run build

    - name: Verify build output
      run: |
        if [ ! -d "dist" ]; then
          echo "❌ dist/ folder not found after build"
          exit 1
        fi
        echo "✅ Frontend built successfully"
        ls -la dist/

  build-tauri:
    name: Build - Tauri
    runs-on: ubuntu-latest
    needs: [code-quality-rust]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ env.RUST_VERSION }}

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ env.BUN_VERSION }}

    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          src-tauri/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install frontend dependencies
      run: bun install

    - name: Create sidecar placeholder
      run: |
        mkdir -p src-tauri/binaries
        TARGET_TRIPLE=$(rustc -vV | grep host | awk '{print $2}')
        touch "src-tauri/binaries/quiver-${TARGET_TRIPLE}"
        chmod +x "src-tauri/binaries/quiver-${TARGET_TRIPLE}"

    - name: Build Tauri backend
      run: |
        cd src-tauri
        cargo build --release

    - name: Verify binary
      run: |
        BINARY="src-tauri/target/release/quiverdesktop"
        if [ ! -f "$BINARY" ]; then
          echo "❌ Binary not found at $BINARY after build"
          exit 1
        fi
        echo "✅ Tauri binary built successfully"
