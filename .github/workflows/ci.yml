name: CI

on:
  pull_request:
    branches: [ master, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]

env:
  RUST_VERSION: 'stable'

jobs:
  draft-reminder:
    name: Draft PR Reminder
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == true && github.event.action == 'opened'
    permissions:
      pull-requests: write
    steps:
    - name: Comment on draft PR
      uses: actions/github-script@v9
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `⚠️ **Draft PR Reminder**\n\nHey @${context.payload.pull_request.user.login}!\n\nBe sure to run the command \`make pr-checks\` before opening this PR. Thanks!\n\n> **Note:** CI won't run on draft PRs to optimize [GitHub Actions billing](https://docs.github.com/en/billing/concepts/product-billing/github-actions). Mark as ready for review when you're done! 🚀`
          });

  validate-branch:
    name: Validate Branch Model
    runs-on: ubuntu-latest
    steps:
    - name: Check if PR is draft
      run: |
        if [ "${{ github.event.pull_request.draft }}" == "true" ]; then
          echo "❌ This PR is a draft. Please mark it as ready for review to run CI checks."
          exit 1
        fi
        echo "✅ PR is ready for review"

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate branching model
      env:
        SOURCE_BRANCH: ${{ github.head_ref }}
        TARGET_BRANCH: ${{ github.base_ref }}
      run: |

        echo "Source branch: $SOURCE_BRANCH"
        echo "Target branch: $TARGET_BRANCH"

        validate_branch() {
          case "$SOURCE_BRANCH" in
            enhancement/*)
              if [ "$TARGET_BRANCH" != "develop" ]; then
                echo "❌ Enhancement branches can only target 'develop', not '$TARGET_BRANCH'"
                exit 1
              fi
              ;;
            feature/*)
              if [ "$TARGET_BRANCH" != "develop" ]; then
                echo "❌ Feature branches can only target 'develop', not '$TARGET_BRANCH'"
                exit 1
              fi
              ;;
            fix/*)
              if [ "$TARGET_BRANCH" != "develop" ]; then
                echo "❌ Fix branches can only target 'develop', not '$TARGET_BRANCH'"
                exit 1
              fi
              ;;
            refactor/*)
              if [ "$TARGET_BRANCH" != "develop" ]; then
                echo "❌ Refactor branches can only target 'develop', not '$TARGET_BRANCH'"
                exit 1
              fi
              ;;
            dependabot/*)
              if [ "$TARGET_BRANCH" != "develop" ]; then
                echo "❌ Dependabot branches can only target 'develop', not '$TARGET_BRANCH'"
                exit 1
              fi
              ;;
            hotfix/*)
              if [ "$TARGET_BRANCH" != "master" ]; then
                echo "❌ Hotfix branches can only target 'master', not '$TARGET_BRANCH'"
                exit 1
              fi
              ;;
            beta/*)
              if [ "$TARGET_BRANCH" != "master" ]; then
                echo "❌ Beta branches can only target 'master', not '$TARGET_BRANCH'"
                exit 1
              fi
              ;;
            backport/*)
              if [ "$TARGET_BRANCH" != "develop" ]; then
                echo "❌ Backport branches can only target 'develop', not '$TARGET_BRANCH'"
                exit 1
              fi
              ;;
            *)
              echo "❌ Invalid branch name '$SOURCE_BRANCH'. Must follow pattern:"
              echo "  - enhancement/name (→ develop)"
              echo "  - feature/name (→ develop)"
              echo "  - fix/name (→ develop)"
              echo "  - refactor/name (→ develop)"
              echo "  - hotfix/name (→ master)"
              echo "  - beta/YY.M or beta/YY.M.P (→ master)"
              echo "  - backport/DATE-VERSION (→ develop)"
              exit 1
              ;;
          esac

          echo "✅ Quiver loves your PR: $SOURCE_BRANCH → $TARGET_BRANCH"
        }

        validate_branch

  validate-core-version:
    name: Validate CORE_VERSION
    runs-on: ubuntu-latest
    needs: validate-branch
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ env.RUST_VERSION }}

    # installer/core-channels.json holds a CHANNEL NAME, not a tag, so it cannot be handed to `gh` as-is.
    # This gate always tracks the CURRENT newest stable release: there is no compatibility range, this
    # build/test run is the gate. cargo xtask resolve-core-version fails on an empty result.
    - name: Validate CORE_VERSION resolves to a real quiver.core release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        CORE_CHANNEL=$(jq -r .stable installer/core-channels.json)
        test -n "$CORE_CHANNEL" && [ "$CORE_CHANNEL" != "null" ] || { echo "stable missing from installer/core-channels.json"; exit 1; }
        CORE_VERSION=$(cargo xtask resolve-core-version "$CORE_CHANNEL")
        test -n "$CORE_VERSION" || { echo "could not resolve a quiver.core release on channel ${CORE_CHANNEL}"; exit 1; }
        gh release view "$CORE_VERSION" --repo rabbytesoftware/quiver.core >/dev/null \
          || { echo "quiver.core release ${CORE_VERSION} not found."; exit 1; }
        echo "quiver.core release ${CORE_VERSION} exists"

  # Everything `make gate` runs except clippy/test (which need the GPUI system libraries, see `test` below).
  # cargo xtask compiles only xtask. setup-rust-toolchain caches ~/.cargo and target/ keyed on Cargo.lock.
  lint:
    name: Lint - fmt, deny, audit, machete, structure
    runs-on: ubuntu-latest
    needs: validate-branch
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: rustfmt

    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny,cargo-audit,cargo-machete

    - run: cargo fmt --all --check
    - run: cargo deny check
    - run: cargo audit
    - run: cargo machete
    - run: cargo xtask check-deps
    - run: cargo xtask check-layout

  # GPUI needs a Vulkan device (lavapipe) and a display for the rendering tests: Xvfb + Mesa software Vulkan,
  # as in the dev container.
  test:
    name: Test - clippy, test (ubuntu)
    runs-on: ubuntu-latest
    needs: validate-branch
    env:
      ZED_ALLOW_EMULATED_GPU: '1'
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/native-linux-deps

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: clippy

    - run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Clippy with the e2e bridge feature (debug-only code must stay warning free too)
      run: cargo clippy -p quiver-app --all-targets --features e2e-bridge -- -D warnings
    - run: xvfb-run -a cargo test --workspace

  # The per-platform arms (cfg(windows), cfg(target_os = "macos")) that no Linux job builds: a release build of
  # the app plus the workspace tests. UNVERIFIED on GitHub: the rendering tests need a GPU session; if the
  # hosted runners lack one, restrict the test step to the crates that do not open a window.
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: validate-branch
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ env.RUST_VERSION }}

    - run: cargo build --release -p quiver-app
    - run: cargo test --workspace

  # The bridge must never ship: build the way release-native.yml does (no e2e-bridge), then scan the binaries.
  release-artifact:
    name: Release build has no e2e bridge
    runs-on: ubuntu-latest
    needs: validate-branch
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/native-linux-deps

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ env.RUST_VERSION }}

    - run: make build
    - run: make check-release

  # Builds the app WITH the bridge inside docker/e2e and runs `cargo test -p quiver-e2e --test scenarios`.
  e2e-box:
    name: E2E box
    runs-on: ubuntu-latest
    needs: validate-branch
    timeout-minutes: 90
    steps:
    - name: Checkout quiver.desktop
      uses: actions/checkout@v4
      with:
        path: quiver.desktop

    - name: Checkout quiver.core
      uses: actions/checkout@v4
      with:
        repository: rabbytesoftware/quiver.core
        ref: develop
        token: ${{ secrets.GITHUB_TOKEN }}
        path: quiver.core

    - name: Run the scenarios in the box
      env:
        QUIVER_CORE_DEV_PATH: ${{ github.workspace }}/quiver.core
      run: make -C quiver.desktop test-e2e-box

    - name: Make the results readable
      # The box runs as root: its result directories (and the screenshots in them) are not scannable by the
      # runner user, which made the upload below fail with EACCES even when every scenario passed.
      if: always()
      run: sudo chown -R "$(id -u):$(id -g)" quiver.desktop/docker/e2e/results || true

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-box-results
        path: quiver.desktop/docker/e2e/results/
        if-no-files-found: ignore
