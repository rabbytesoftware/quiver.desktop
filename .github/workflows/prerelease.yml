name: Pre-release

on:
  push:
    branches:
      - 'beta/**'
      - 'hotfix/**'

env:
  RUST_VERSION: '1.88'
  BUN_VERSION: 'latest'
  # Only used by the `prepare` job, which runs scripts/resolve-core-version.mjs.
  # `import.meta.main` (the script's entry-point guard) was added in Node
  # v22.18.0 / v24.2.0 -- an unpatched runtime silently prints nothing and
  # exits 0 instead of erroring, which is why the call site also carries an
  # empty-output guard as the real safety net, not the version pin alone.
  NODE_VERSION: '24'

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.TAG }}
      core_version: ${{ steps.version.outputs.CORE_VERSION }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch all tags
      run: git fetch --tags

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ env.BUN_VERSION }}

    # scripts/resolve-core-version.mjs `import`s `semver` (so node_modules has
    # to exist) and guards its entry point with `import.meta.main`, added in
    # Node v22.18.0 / v24.2.0 — an unpatched runtime silently prints nothing
    # and exits 0, yielding an empty tag rather than a failure (the
    # empty-output guard further down is the real safety net here, not the
    # version pin alone). Pin both rather than trust whatever the runner
    # image happens to ship today.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install dependencies
      run: bun install --frozen-lockfile

    # package.json pins a semver CONSTRAINT ("^26.5"), not a tag. Resolving it
    # here — once — is what makes every downstream `gh` call work: this job's
    # own existence check, and the `gh release download` that
    # .github/actions/build-tauri runs on all three platforms with the
    # core_version output below as its `quiver-version` input.
    - name: Resolve and validate CORE_VERSION
      id: version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        CORE_CONSTRAINT=$(node -p "require('./package.json').quiver.coreVersion")
        if [ -z "$CORE_CONSTRAINT" ]; then
          echo "❌ quiver.coreVersion missing from package.json"
          exit 1
        fi
        echo "Resolving quiver.core constraint: ${CORE_CONSTRAINT}"

        CORE_VERSION=$(node scripts/resolve-core-version.mjs "$CORE_CONSTRAINT")
        if [ -z "$CORE_VERSION" ]; then
          echo "❌ could not resolve a quiver.core release matching ${CORE_CONSTRAINT}"
          exit 1
        fi
        echo "Resolved to: ${CORE_VERSION}"

        gh release view "$CORE_VERSION" --repo rabbytesoftware/quiver.core || {
          echo "❌ quiver.core release ${CORE_VERSION} not found. Core must be released before desktop."
          exit 1
        }

        # The RESOLVED tag, deliberately: every consumer of this output feeds
        # it to `gh` as a literal tag, never as a constraint.
        echo "CORE_VERSION=${CORE_VERSION}" >> "$GITHUB_OUTPUT"
        echo "✅ quiver.core release ${CORE_VERSION} exists and satisfies ${CORE_CONSTRAINT}"

    - name: Derive pre-release tag
      id: tag
      env:
        BRANCH: ${{ github.ref_name }}
      run: |
        if [[ "$BRANCH" == beta/* ]]; then
          SERIES="${BRANCH#beta/}"
          COUNT=$(git tag -l "beta-${SERIES}" "beta-${SERIES}-*" | wc -l | tr -d ' ')
          if [ "$COUNT" -eq "0" ]; then
            TAG="beta-${SERIES}"
          else
            TAG="beta-${SERIES}-${COUNT}"
          fi

        elif [[ "$BRANCH" == hotfix/* ]]; then
          LATEST=$(git tag -l "stable-*" | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "❌ No stable baseline found. A hotfix requires an existing stable release."
            exit 1
          fi
          VERSION="${LATEST#stable-}"
          PARTS=$(echo "$VERSION" | tr '.' '\n' | wc -l | tr -d ' ')
          if [ "$PARTS" -eq "2" ]; then
            HOTFIX_VERSION="${VERSION}.1"
          else
            BASE=$(echo "$VERSION" | cut -d'.' -f1,2)
            PATCH=$(echo "$VERSION" | cut -d'.' -f3)
            HOTFIX_VERSION="${BASE}.$((PATCH + 1))"
          fi
          COUNT=$(git tag -l "hotfix-${HOTFIX_VERSION}" "hotfix-${HOTFIX_VERSION}-*" | wc -l | tr -d ' ')
          if [ "$COUNT" -eq "0" ]; then
            TAG="hotfix-${HOTFIX_VERSION}"
          else
            TAG="hotfix-${HOTFIX_VERSION}-${COUNT}"
          fi
        else
          echo "❌ Unrecognized branch pattern: ${BRANCH}"
          exit 1
        fi

        echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
        echo "Computed pre-release tag: ${TAG}"

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-26 is pinned deliberately, NOT macos-latest: the adaptive-icon
        # step needs an Xcode whose actool can compile Icon Composer .icon
        # assets. macOS 26 ships Xcode 26.5 which does; macOS 15's newest is
        # Xcode 26.3.0 whose actool CRASHES on our .icon
        # (CompileAssetCatalogVariant exit 65). macos-latest is mid-migration
        # from 15 to 26 and lands nondeterministically on either.
        os: [ubuntu-latest, macos-26, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Tauri app
      uses: ./.github/actions/build-tauri
      with:
        quiver-version: ${{ needs.prepare.outputs.core_version }}
        rust-version: ${{ env.RUST_VERSION }}
        bun-version: ${{ env.BUN_VERSION }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Signing + notarization are opt-in: when these secrets are unset they
        # expand to empty strings and the script builds the same ad-hoc
        # (unsigned) DMG as before. See scripts/build-macos-dmg.sh.
        APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    - name: Upload Linux artifacts
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: linux-artifacts
        path: |
          src-tauri/target/release/bundle/appimage/*.AppImage
          src-tauri/target/release/bundle/deb/*.deb

    # Universal build, so the bundle lands under the universal triple's target
    # dir rather than target/release/.
    - name: Upload macOS artifacts
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: macos-artifacts
        path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
        if-no-files-found: error

    - name: Upload Windows artifacts
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: windows-artifacts
        path: |
          src-tauri/target/release/bundle/msi/*.msi
          src-tauri/target/release/bundle/nsis/*.exe

  publish:
    name: Publish Pre-release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch all tags
      run: git fetch --tags

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Generate changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          echo "## Changes since ${PREV_TAG}" > CHANGELOG.md
          git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%an)" --no-merges >> CHANGELOG.md
        else
          echo "## Initial Pre-release" > CHANGELOG.md
        fi

    - name: Publish pre-release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        FILES=$(find artifacts/ -type f | tr '\n' ' ')
        gh release create "$TAG" \
          --prerelease \
          --title "$TAG" \
          --notes-file CHANGELOG.md \
          $FILES

    - name: Comment release on PR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.prepare.outputs.tag }}
        BRANCH: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        PR=$(gh pr list --head "$BRANCH" --base master --json number --jq '.[0].number' 2>/dev/null || true)
        if [ -n "$PR" ] && [ "$PR" != "null" ]; then
          gh pr comment "$PR" --body "Pre-release [**${TAG}**](https://github.com/${REPO}/releases/tag/${TAG}) has been published."
        fi
