name: Nightly

# Rolling build of `develop`, published to a single `nightly-rolling` tag that
# is deleted and recreated each run. Deliberately NOT part of the beta-/stable-
# tag scheme in prerelease.yml and stable-release.yml — nothing here creates a
# durable tag, and nothing downstream should ever pin to `nightly-rolling`.
#
# NOTE: the literal tag `nightly` is permanently unusable for this repo — a
# release was briefly published under it while GitHub's Immutable Releases
# setting was enabled (see repo settings: Immutable Releases is now off), and
# GitHub keeps tag names reserved forever once an immutable release has used
# them, even after that release and tag are deleted. Don't rename this back
# to `nightly`.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # Always tracks quiver.core's own rolling nightly channel (installer/core-channels.json). Build, checksums and
  # publishing (delete the previous nightly-rolling release and its tag, publish a prerelease) are
  # release-native.yml.
  release:
    name: Nightly
    permissions:
      contents: write
    uses: ./.github/workflows/release-native.yml
    secrets: inherit
    with:
      channel: nightly-rolling
      tag: nightly-rolling
