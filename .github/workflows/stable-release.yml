name: Stable Release

on:
  pull_request:
    branches: [ master ]
    types: [ closed ]

env:
  RUST_VERSION: '1.88'
  BUN_VERSION: 'latest'

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Stable Release
    runs-on: ubuntu-latest
    if: "github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'beta/') || startsWith(github.event.pull_request.head.ref, 'hotfix/'))"
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.TAG }}
      core_version: ${{ steps.version.outputs.CORE_VERSION }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch all tags
      run: git fetch --tags

    - name: Read CORE_VERSION
      id: version
      run: |
        CORE_VERSION=$(node -p "require('./package.json').quiver.coreVersion")
        echo "CORE_VERSION=${CORE_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Validate CORE_VERSION
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        CORE_VERSION="${{ steps.version.outputs.CORE_VERSION }}"
        echo "Validating quiver.core release: ${CORE_VERSION}"
        gh release view "$CORE_VERSION" --repo rabbytesoftware/quiver.core || {
          echo "❌ quiver.core release ${CORE_VERSION} not found. Core must be released before desktop."
          exit 1
        }
        echo "✅ quiver.core release ${CORE_VERSION} exists"

    - name: Derive stable tag
      id: tag
      env:
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
      run: |
        SOURCE="$HEAD_REF"

        if [[ "$SOURCE" == beta/* ]]; then
          BRANCH_VERSION="${SOURCE#beta/}"
          SERIES=$(echo "$BRANCH_VERSION" | cut -d'.' -f1,2)
        elif [[ "$SOURCE" == hotfix/* ]]; then
          LATEST=$(git tag -l "stable-*" | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "❌ No stable baseline found. A hotfix requires an existing stable release."
            exit 1
          fi
          VERSION="${LATEST#stable-}"
          SERIES=$(echo "$VERSION" | cut -d'.' -f1,2)
        fi

        LATEST_IN_SERIES=$(git tag -l "stable-${SERIES}" "stable-${SERIES}.*" | sort -V | tail -1)

        if [ -z "$LATEST_IN_SERIES" ]; then
          TAG="stable-${SERIES}"
        else
          PATCH_VERSION="${LATEST_IN_SERIES#stable-}"
          PARTS=$(echo "$PATCH_VERSION" | tr '.' '\n' | wc -l | tr -d ' ')
          if [ "$PARTS" -eq "2" ]; then
            TAG="stable-${PATCH_VERSION}.1"
          else
            BASE=$(echo "$PATCH_VERSION" | cut -d'.' -f1,2)
            PATCH=$(echo "$PATCH_VERSION" | cut -d'.' -f3)
            TAG="stable-${BASE}.$((PATCH + 1))"
          fi
        fi

        echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
        echo "Computed stable tag: ${TAG}"

    - name: Create and push stable tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "${{ steps.tag.outputs.TAG }}"
        git push origin "${{ steps.tag.outputs.TAG }}"

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-26 is pinned deliberately, NOT macos-latest: the adaptive-icon
        # step needs an Xcode whose actool can compile Icon Composer .icon
        # assets. macOS 26 ships Xcode 26.5 which does; macOS 15's newest is
        # Xcode 26.3.0 whose actool CRASHES on our .icon
        # (CompileAssetCatalogVariant exit 65). macos-latest is mid-migration
        # from 15 to 26 and lands nondeterministically on either.
        os: [ubuntu-latest, macos-26, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Tauri app
      uses: ./.github/actions/build-tauri
      with:
        quiver-version: ${{ needs.prepare.outputs.core_version }}
        rust-version: ${{ env.RUST_VERSION }}
        bun-version: ${{ env.BUN_VERSION }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Signing + notarization are opt-in: when these secrets are unset they
        # expand to empty strings and the script builds the same ad-hoc
        # (unsigned) DMG as before. See scripts/build-macos-dmg.sh.
        APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    - name: Upload Linux artifacts
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: linux-artifacts
        path: |
          src-tauri/target/release/bundle/appimage/*.AppImage
          src-tauri/target/release/bundle/deb/*.deb

    # Universal build, so the bundle lands under the universal triple's target
    # dir rather than target/release/.
    - name: Upload macOS artifacts
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: macos-artifacts
        path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
        if-no-files-found: error

    - name: Upload Windows artifacts
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: windows-artifacts
        path: |
          src-tauri/target/release/bundle/msi/*.msi
          src-tauri/target/release/bundle/nsis/*.exe

  publish:
    name: Publish Stable Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch all tags
      run: git fetch --tags

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Generate changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          echo "## Changes since ${PREV_TAG}" > CHANGELOG.md
          git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%an)" --no-merges >> CHANGELOG.md
        else
          echo "## Initial Release" > CHANGELOG.md
        fi

    - name: Publish stable release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        FILES=$(find artifacts/ -type f | tr '\n' ' ')
        gh release create "$TAG" \
          --title "$TAG" \
          --notes-file CHANGELOG.md \
          $FILES

  backport:
    name: Backport to Develop
    needs: [prepare, publish]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/backport.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.tag }}
