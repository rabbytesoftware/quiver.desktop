name: Stable Release

on:
  pull_request:
    branches: [ master ]
    types: [ closed ]

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Stable Release
    runs-on: ubuntu-latest
    if: "github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'beta/') || startsWith(github.event.pull_request.head.ref, 'hotfix/'))"
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.TAG }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch all tags
      run: git fetch --tags

    - name: Derive stable tag
      id: tag
      env:
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
      run: |
        SOURCE="$HEAD_REF"

        if [[ "$SOURCE" == beta/* ]]; then
          BRANCH_VERSION="${SOURCE#beta/}"
          SERIES=$(echo "$BRANCH_VERSION" | cut -d'.' -f1,2)
        elif [[ "$SOURCE" == hotfix/* ]]; then
          LATEST=$(git tag -l "stable-*" | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "❌ No stable baseline found. A hotfix requires an existing stable release."
            exit 1
          fi
          VERSION="${LATEST#stable-}"
          SERIES=$(echo "$VERSION" | cut -d'.' -f1,2)
        fi

        LATEST_IN_SERIES=$(git tag -l "stable-${SERIES}" "stable-${SERIES}.*" | sort -V | tail -1)

        if [ -z "$LATEST_IN_SERIES" ]; then
          TAG="stable-${SERIES}"
        else
          PATCH_VERSION="${LATEST_IN_SERIES#stable-}"
          PARTS=$(echo "$PATCH_VERSION" | tr '.' '\n' | wc -l | tr -d ' ')
          if [ "$PARTS" -eq "2" ]; then
            TAG="stable-${PATCH_VERSION}.1"
          else
            BASE=$(echo "$PATCH_VERSION" | cut -d'.' -f1,2)
            PATCH=$(echo "$PATCH_VERSION" | cut -d'.' -f3)
            TAG="stable-${BASE}.$((PATCH + 1))"
          fi
        fi

        echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
        echo "Computed stable tag: ${TAG}"

  # A beta/* merge resolves the stable quiver.core channel fresh. A hotfix/* merge does NOT: it pins to the
  # quiver.core the latest stable release recorded (pin_core_to_stable), so the shipped release carries the same
  # guarantee as its disposable pre-release. release-native.yml creates and pushes the stable tag once that
  # core release is known to exist, and stamps it into the build (the checkout has no tags at fetch-depth 1).
  release:
    name: Stable Release
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/release-native.yml
    secrets: inherit
    with:
      channel: stable
      tag: ${{ needs.prepare.outputs.tag }}
      create_tag: true
      pin_core_to_stable: ${{ startsWith(github.event.pull_request.head.ref, 'hotfix/') }}

  backport:
    name: Backport to Develop
    needs: [prepare, release]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/backport.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.tag }}
