[package]
name = "quiver-app"
description = "The Quiver Desktop binaries: views only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "quiver_app"
path = "src/lib.rs"

[[bin]]
name = "quiver"
path = "src/main.rs"

[features]
# Debug-only control bridge. Never enabled in release builds (CI checks the artifact).
e2e-bridge = ["quiver-ui/inspect", "dep:quiver-e2e"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64 = "0.22"
futures-util.workspace = true
gpui.workspace = true
gpui-component.workspace = true
http.workspace = true
log.workspace = true
quiver-arrow-host.workspace = true
quiver-core-client.workspace = true
quiver-platform.workspace = true
quiver-release.workspace = true
quiver-state.workspace = true
quiver-theme.workspace = true
quiver-ui.workspace = true
quiver-e2e = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
raw-window-handle = "0.6"
wry = "0.53"

# Arrow apps' webviews are children of the main window; on Linux wry's X11 backend runs on GTK, which
# gets a thread of its own (services/arrow_windows/embedded).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11-dl = "2"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true

# Reserved for the views and the arrow-window helper that land after the services.
[package.metadata.cargo-machete]
ignored = ["anyhow", "base64", "quiver-e2e"]
