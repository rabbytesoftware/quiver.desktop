[package]
name = "quiver-app"
description = "The Quiver Desktop binaries: views only."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "quiver_app"
path = "src/lib.rs"

[[bin]]
name = "quiver"
path = "src/main.rs"

# Arrow apps run in a separate WebView process so the GPUI main thread never has to host tao/wry
# (macOS requires the main thread for both) and the main binary links no GTK/WebKit on Linux.
[[bin]]
name = "quiver-arrow-window"
path = "src/bin/arrow_window/main.rs"
required-features = ["arrow-window"]

[features]
default = ["arrow-window"]
arrow-window = ["dep:wry", "dep:tao"]
# Debug-only control bridge. Never enabled in release builds (CI checks the artifact).
e2e-bridge = ["quiver-ui/inspect", "dep:quiver-e2e"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64 = "0.22"
futures-util.workspace = true
gpui.workspace = true
http.workspace = true
log.workspace = true
quiver-arrow-host.workspace = true
quiver-core-client.workspace = true
quiver-platform.workspace = true
quiver-release.workspace = true
quiver-state.workspace = true
quiver-theme.workspace = true
quiver-ui.workspace = true
quiver-e2e = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tao = { version = "0.34", optional = true }
wry = { version = "0.53", optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true

# Reserved for the views and the arrow-window helper that land after the services.
[package.metadata.cargo-machete]
ignored = ["anyhow", "base64", "quiver-e2e"]
