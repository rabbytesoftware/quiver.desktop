# E2E verification box for the native app. `make test-e2e-box` runs
#   docker compose -f docker/e2e/docker-compose.yml run --rm e2e scenarios/run-native.sh
# (headless shell scenarios: scenarios/run-all.sh). To poke around with the desktop visible in a browser:
#   docker compose -f docker/e2e/docker-compose.yml up --build
# then open http://localhost:6080/vnc.html
services:
  e2e:
    build:
      # This directory, not the repo root: see the Dockerfile's own header.
      context: .
      dockerfile: Dockerfile
    image: quiver-e2e:latest
    ports:
      - "${E2E_NOVNC_BIND:-127.0.0.1}:${E2E_NOVNC_PORT:-6080}:6080"
    volumes:
      # This repo (quiver.desktop) at its usual mount point...
      - ../..:/workspace/quiver.desktop
      # ...and a sibling checkout of quiver.core, expected to already exist
      # on the host at the path the sibling-repo dev convention already uses
      # (see quiver.desktop's own Makefile QUIVER_CORE_DEV_PATH).
      - ${QUIVER_CORE_DEV_PATH:-../../../quiver.core-self-update}:/workspace/quiver.core
      # Everything a run produces, on the host, surviving the container.
      - ./results:/workspace/results
      # Build outputs live in named volumes rather than in the bind mounts: the host checkouts are macOS or
      # Windows ones, and a Linux target/ or bin/ written into them would collide with the host's own build.
      # run-native.sh/build.sh point CARGO_TARGET_DIR at /workspace/build/cargo-target.
      - quiver-e2e-cargo:/usr/local/cargo/registry
      - quiver-e2e-go:/root/go/pkg/mod
      - quiver-e2e-gocache:/root/.cache/go-build
      - quiver-e2e-target:/workspace/build
    shm_size: "1gb"
    # webkit2gtk's own bubblewrap sandbox (the arrow-app helper's WebView) cannot start under the default seccomp
    # profile; WEBKIT_FORCE_SANDBOX=0 (see the Dockerfile) covers the normal case, and these cover the paths that
    # still reach for it.
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    working_dir: /workspace/quiver.desktop/docker/e2e

volumes:
  quiver-e2e-cargo:
  quiver-e2e-go:
  quiver-e2e-gocache:
  quiver-e2e-target:
