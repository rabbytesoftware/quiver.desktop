[package]
name = "quiverdesktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quiverdesktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No "macos-private-api": that feature exists to allow transparent windows, and
# Quiver's shell is opaque. Tauri cross-checks this list against the allowlist
# implied by tauri.conf.json, so it has to come out alongside macOSPrivateApi.
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
thiserror = "1"
log = "0.4"
tauri-plugin-log = "2"
async-trait = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
hyperlocal = "0.9"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
uuid = { version = "1", features = ["v4"] }
bytes = "1"
# Dev-only: lets the Tauri MCP server drive and inspect the webview over
# WebSocket :9223. Registered behind cfg(debug_assertions) in lib.rs so it is
# never active in a release build. Keep the minor version paired with
# @hypothesi/tauri-mcp-server in .mcp.json — they ship as a matched set.
tauri-plugin-mcp-bridge = "0.12"

# Raising RLIMIT_NOFILE at startup (see src/fdlimit.rs). The macOS-only `cocoa`
# crate that used to sit here was never referenced from any source file — the
# native work this crate does now goes through tauri::menu and libc instead.
[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"

[lints.clippy]
cognitive_complexity = "warn"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
