<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/quiver.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiver</title>
    <script>
      (function () {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        document.documentElement.classList.toggle('dark', mq.matches);
        mq.addEventListener('change', function (e) {
          document.documentElement.classList.toggle('dark', e.matches);
        });
      })();
    </script>
  </head>

  <!--
    No data-tauri-drag-region on <body>: it made the entire window draggable,
    which was harmless only while there was no UI to click. The drag region now
    lives on the Titlebar strip (src/components/titlebar.tsx), so dragging works
    where a user expects it and content below stays interactive.
  -->
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
