<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/quiver.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiver</title>
    <script>
      // Applies the persisted theme before first paint, so there is nothing
      // for src/features/shell/theme.ts to correct once React mounts. Reads
      // localStorage directly (zustand's `persist` shape) rather than
      // waiting for the store, and falls back to the OS query whenever the
      // preference is "system" or the stored value cannot be trusted —
      // parsing must never throw here, since this runs before anything else
      // on the page.
      //
      // Deliberately does NOT listen for `change` on the media query: that
      // is `installThemeSync`'s job (src/features/shell/theme.ts) once it
      // takes over. A second listener here would race it depending on which
      // MediaQueryList happened to be created first — an accident, not a
      // guarantee.
      (function () {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var preference = 'system';
        try {
          var raw = localStorage.getItem('quiver.theme');
          if (raw) {
            var stored = JSON.parse(raw).state.preference;
            if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored;
          }
        } catch (e) {
          preference = 'system';
        }
        var dark = preference === 'dark' || (preference === 'system' && mq.matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>

  <!--
    No data-tauri-drag-region on <body>: it made the entire window draggable,
    which was harmless only while there was no UI to click. The drag region now
    lives on the Titlebar strip (src/components/titlebar.tsx), so dragging works
    where a user expects it and content below stays interactive.
  -->
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
