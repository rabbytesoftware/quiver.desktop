[graph]
all-features = false

[advisories]
version = 2
# Every ignore is an "unmaintained" notice (no vulnerability) for a crate that only arrives through
# GPUI / wry / keyring. We cannot replace them without forking those; re-check on each GPUI bump.
ignore = [
  "RUSTSEC-2025-0052", "RUSTSEC-2025-0057", "RUSTSEC-2024-0384", "RUSTSEC-2024-0436", "RUSTSEC-2026-0441",
  "RUSTSEC-2024-0370", "RUSTSEC-2026-0173", "RUSTSEC-2025-0134", "RUSTSEC-2026-0206",
]
unmaintained = "none"

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "OpenSSL", "0BSD", "BSL-1.0",
  "CDLA-Permissive-2.0", "NCSA", "GPL-3.0-or-later", "GPL-3.0-only", "LGPL-3.0-or-later",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
