[graph]
all-features = false

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "OpenSSL", "0BSD", "BSL-1.0",
  "CDLA-Permissive-2.0", "GPL-3.0-or-later", "GPL-3.0-only", "LGPL-3.0-or-later",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
